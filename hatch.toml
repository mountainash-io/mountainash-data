#================
# Env: ruff
#================
[envs.ruff]
installer = "uv"
detached = true
dependencies = ["ruff==0.3.7"]
[envs.ruff.scripts]
check = "ruff check ./src"
fix = "ruff check ./src --fix"

#================
# Env: radon
#================
# Radon Complexity Checks
[envs.radon]
installer = "uv"
detached = true
dependencies = ["radon==6.0.1"]
[envs.radon.scripts]
radon-cc = "radon cc ./src -nd"
radon-mi = "radon mi ./src -nd"
radon-cc-strict = "radon cc ./src -nc"
radon-mi-strict = "radon mi ./src -nc"
radon-mi-detail = "radon mi ./src"
radon-cc-detail = "radon cc ./src"

#================
# Env: mypy
#================
# Mypy Type checks
[envs.mypy]
installer = "uv"
features = ["sqlite", "duckdb", "polars"]
dependencies = [
    "mypy==1.10.1",
    "pytest==8.3.5",
    "pytest-mock==3.12.0",
    "pytest-check==2.5.3",
    "mountainash_settings @     {env:HATCH_SIBLINGS}/mountainash-settings",
    "mountainash @              {env:HATCH_SIBLINGS}/mountainash",
    "mountainash_auth_client @  {env:HATCH_SIBLINGS}/mountainash-auth-client",
]
[envs.mypy.scripts]
check = "mypy --install-types --non-interactive --explicit-package-bases {args:src/mountainash_data tests}"
check-src = "mypy --install-types --non-interactive src/mountainash_data {args}"
check-tests = "mypy --install-types --non-interactive --explicit-package-bases tests {args}"
check-src-untyped = "mypy --install-types --non-interactive --check-untyped-defs src/mountainash_data {args}"
check-tests-untyped = "mypy --install-types --non-interactive --explicit-package-bases --check-untyped-defs tests {args}"

# Same checks and tools as local mypy, with CI's sibling checkout layout.
[envs.mypy_github]
template = "mypy"
# mypy --install-types invokes pip; uv-created environments do not seed it.
extra-dependencies = ["pip"]

[envs.mypy_github.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"

[envs.default.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/.."

[envs.build_github.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"

[envs.test_github.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"

[envs.test_github_live.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"

[envs.test_optional.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"
