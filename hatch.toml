[metadata]
allow-direct-references = true

[version]
path = "src/mountainash_data/__version__.py"

[build.targets.wheel]
packages = ["src/mountainash_data"]


#================
# Env: dev
#================

[envs.dev]
python = "3.12" #,  "3.11",, "3.10" ] # "3.8", "3.9","3.9",
installer = "uv"
path = ".venv"
features = ["sqlite", "duckdb", "polars"]
dependencies = [
    "mountainash_settings @     {root:uri}/../mountainash-settings",
    "mountainash @              {root:uri}/../mountainash",
    "mountainash_auth_client @  {root:uri}/../mountainash-auth-client",

]

#================
# Env: build_github
#================
[envs.build_github]
installer = "uv"
dependencies = [
    "cyclonedx-bom==4.5.0",

    "mountainash_settings @     {root:uri}/temp/mountainash-settings",
    "mountainash @              {root:uri}/temp/mountainash",
    "mountainash_auth_client @  {root:uri}/temp/mountainash-auth-client",

]
[envs.build_github.scripts]
sbom-all = "cyclonedx-py environment > ./sbom-full.xml"
sbom-direct = "cyclonedx-py requirements > ./sbom-direct.xml"
export-requirements = "hatch dep show requirements > ./requirements.txt"

#================
# Env: default
#================
[envs.default]
installer = "uv"
dependencies = [
    # "mountainash_constants @      {root:uri}/../mountainash-constants",
    # "mountainash_settings @       {root:uri}/../mountainash-settings",
    # "mountainash_transport @        {root:uri}/../mountainash-transport",
    # "mountainash_utils_os @           {root:uri}/../mountainash-utils-os",
    # "mountainash_utils_ssh @          {root:uri}/../mountainash-utils-ssh",
]

#================
# Env: tower
#================
[envs.tower]
installer = "uv"

dependencies = []


#================
# Env: test_github
#================
[[envs.test_github.matrix]]
python = ["3.12"]

[envs.test_github]
installer = "uv"
features = ["sqlite", "duckdb", "polars"]
dependencies = [
    "pytest==8.3.5",
    "pytest-asyncio>=0.24",
    "pytest-check==2.5.3",
    "pytest-cov==6.1.1",
    "psutil>=7.0.0",  # live-db harness (scripts/live_db_harness/process.py), imported by unit tests

    "mountainash_settings @     {root:uri}/temp/mountainash-settings",
    "mountainash @              {root:uri}/temp/mountainash",
    "mountainash_auth_client @  {root:uri}/temp/mountainash-auth-client",
]
[envs.test_github.scripts]
test = "pytest {args}"
test-cov = "pytest --cov --cov-config={root}/pyproject.toml --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"

#================
# Env: test_github_live
#================
[[envs.test_github_live.matrix]]
python = ["3.12"]

[envs.test_github_live]
installer = "uv"
# Live-db drivers come from the backend extras — installed only here, never in
# the bare test_github env the PR-triggered workflow uses. One per backend
# registered in the on-demand workflow (python-verify-live-db.yml).
# mysql needs system libmariadb-dev, installed in CI before this env.
features = ["sqlite", "duckdb", "polars", "postgres", "mysql", "oracle", "singlestoredb"]
dependencies = [
    "pytest==8.3.5",
    "pytest-asyncio>=0.24",
    "pytest-check==2.5.3",
    "pytest-cov==6.1.1",
    "psutil>=7.0.0",  # live-db harness process management

    "mountainash_settings @     {root:uri}/temp/mountainash-settings",
    "mountainash @              {root:uri}/temp/mountainash",
    "mountainash_auth_client @  {root:uri}/temp/mountainash-auth-client",
]
[envs.test_github_live.scripts]
test = "pytest {args}"
live-db = "python -m scripts.live_db {args}"


#================
# Env: test_optional
#================
[envs.test_optional]
python = "3.12"
installer = "uv"
features = ["sqlite", "duckdb", "polars"]
matrix-name-format = "{value}"
dependencies = [
    "pytest==8.3.5",
    "pytest-asyncio>=0.24",
    "pytest-check==2.5.3",
    "pytest-cov==6.1.1",
    "psutil>=7.0.0",  # dependency parity with test_github (test_ci_contract)

    "mountainash_settings @     {root:uri}/temp/mountainash-settings",
    "mountainash @              {root:uri}/temp/mountainash",
    "mountainash_auth_client @  {root:uri}/temp/mountainash-auth-client",
]

[[envs.test_optional.matrix]]
backend = ["oracle", "trino", "bigquery"]

[envs.test_optional.overrides]
matrix.backend.features = [
    { value = "oracle", if = ["oracle"] },
    { value = "trino", if = ["trino"] },
    { value = "bigquery", if = ["bigquery"] },
]

[envs.test_optional.scripts]
test = "pytest tests/test_optional_backends/{matrix:backend} {args}"
test-cov = "pytest --cov --cov-config={root}/pyproject.toml --junitxml=junit-optional-{matrix:backend}.xml --cov-report=xml:coverage-optional-{matrix:backend}.xml tests/test_optional_backends/{matrix:backend} {args}"


#================
# Env: test
#================
[[envs.test.matrix]]
python = ["3.12"] #,  "3.11",, "3.10" ] # "3.8", "3.9","3.9",

[envs.test]
type = "virtual"
installer = "uv"
features = ["sqlite", "duckdb", "polars"]
dependencies = [
    "coverage[toml]>=6.5",
    "pytest==8.3.5",
    "pytest-asyncio>=0.24",      # Registers asyncio_default_fixture_loop_scope
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-json-report>=1.5.0", # Structured JSON output
    "pytest-metadata>=2.0.0",    # Additional test metadata
    "pytest-benchmark>=4.0.0",   # Performance benchmarking
    "pytest-cov>=4.1.0",         # Better coverage integration
    "pytest-clarity>=1.0.1",     # Better test output diff
    "pytest-timeout>=2.1.0",     # Test timing control
    "pytest-picked>=0.5.0",      # Changed files testing

    "psutil>=7.0.0",

    "mountainash_settings @     {root:uri}/../mountainash-settings",
    "mountainash @              {root:uri}/../mountainash",
    "mountainash_auth_client @  {root:uri}/../mountainash-auth-client",


]
[envs.test.scripts]
# ===========================================
# CORE TESTING COMMANDS - Use these daily
# ===========================================

test = [
    "pytest --cov --cov-config={root}/pyproject.toml --junitxml=junit.xml tests/test_unit tests/test_integration",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]

# Quick testing for iteration (no coverage overhead)
test-quick = "pytest tests/test_unit tests/test_integration"

# Core tests only, with explicit target arguments
test-core = "pytest tests/test_unit tests/test_integration {args}"

# ===========================================
# TARGETED TESTING - For debugging specific issues
# ===========================================

# Target specific files/tests with coverage
test-target = [
    "coverage run -m pytest {args}",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Target specific files/tests without coverage (fastest iteration)
test-target-quick = "pytest {args}"

# Only changed files (with coverage)
test-changed = [
    "coverage run -m pytest --picked",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Only changed files (without coverage)
test-changed-quick = "pytest --picked"

# ===========================================
# SPECIALIZED TESTING
# ===========================================

# Performance benchmarks only
test-perf = "pytest --benchmark-only"
test-perf-target = "pytest --benchmark-only {args}"

# Specific test markers
test-unit = "pytest -m unit"
test-integration = "pytest -m integration"
test-performance = "pytest -m performance"
# ===========================================
# LIVE-DB TESTING — use the target runner
# ===========================================
#
# Select a target and backend explicitly. The runner loads connection
# settings from the selected target and manages the backend test lifecycle.
#
#   hatch run test_backend.postgres:live-db run --target docker postgres
#   hatch run test_backend.oracle:live-db test --target tunnel oracle
#
# Each test_backend environment installs only its selected backend extra.
#
live-db = "python -m scripts.live_db {args}"

# ===========================================
# CI/REPORTING - For automated environments
# ===========================================

# Full CI suite with all reports
test-ci = [
    "coverage run -m pytest tests/test_unit tests/test_integration --json-report --json-report-file=pytest_report.json --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]

# Optional backend environments inherit core tools, not other backend drivers.
[envs.test_backend]
template = "test"
python = "3.12"
matrix-name-format = "{value}"

[[envs.test_backend.matrix]]
backend = ["postgres", "mysql", "oracle", "singlestoredb", "mssql", "trino", "exasol", "pyspark", "bigquery"]

[envs.test_backend.overrides]
matrix.backend.features = [
    { value = "postgres", if = ["postgres"] },
    { value = "mysql", if = ["mysql"] },
    { value = "oracle", if = ["oracle"] },
    { value = "singlestoredb", if = ["singlestoredb"] },
    { value = "mssql", if = ["mssql"] },
    { value = "trino", if = ["trino"] },
    { value = "exasol", if = ["exasol"] },
    { value = "pyspark", if = ["pyspark"] },
    { value = "bigquery", if = ["bigquery"] },
]
matrix.backend.extra-dependencies = [
    { value = "pyspark[connect]==4.0.2", if = ["pyspark"] },
]


