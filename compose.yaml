services:
  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ibis_testing
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 20
    ports:
      - "5432:5432"
  mysql:
    image: mariadb:12.1.2
    profiles: ["mysql"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: ibis_testing
      MYSQL_USER: ibis
      MYSQL_PASSWORD: ibis
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-P", "3306", "--protocol=TCP"]
      interval: 1s
      retries: 20
    ports:
      - "3306:3306"
  oracle:
    image: gvenzl/oracle-xe:21-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: app
      APP_USER_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "echo exit | sqlplus -L -s app/app@//localhost:1521/XEPDB1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "1521:1521"
  singlestoredb:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    platform: linux/amd64
    profiles: ["singlestoredb"]
    environment:
      ROOT_PASSWORD: singlestore
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "singlestore -h 127.0.0.1 -P 3306 -u root -p\"$${ROOT_PASSWORD}\" -e \"SELECT 1\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - "./tests/config/singlestore-init.sql:/init.sql:ro"
    ports:
      - "3307:3306"
