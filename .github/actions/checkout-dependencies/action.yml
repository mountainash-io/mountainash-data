# .github/actions/checkout-dependencies/action.yml
name: 'Checkout Dependencies'
description: 'Checks out multiple repository dependencies'

inputs:
  dependencies:
    required: true
    description: 'JSON string of dependencies to checkout'
  target-branch:
    required: true
  default-branch:
    required: false
    default: 'main'
  token:
    description: 'GitHub token for authentication'
    required: true
  org-name:
    description: 'GitHub organization name'
    required: true

runs:
  using: composite
  steps:
    - name: Process Dependencies
      shell: bash
      # All inputs reach the script only as environment variables, quoted at use.
      env:
        DEPENDENCIES: ${{ inputs.dependencies }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        GH_DEP_TOKEN: ${{ inputs.token }}
        DEFAULT_ORG: ${{ inputs.org-name }}
      run: |
        # The token is sent as an HTTP header (never placed in a clone URL), so it
        # is not written to the clone's .git/config or visible in the remote URL.
        auth_header="Authorization: basic $(printf 'x-access-token:%s' "$GH_DEP_TOKEN" | base64 -w0)"
        echo "::add-mask::${auth_header#Authorization: basic }"

        # Process each dependency
        printf '%s' "$DEPENDENCIES" | jq -c '.[]' | while read -r dep; do
          # Extract values with error checking
          repo=$(printf '%s' "$dep" | jq -r '.name // empty')
          if [ -z "$repo" ]; then
            echo "Error: Invalid repository name in dependency"
            continue
          fi

          org_name=$(printf '%s' "$dep" | jq -r --arg default_org "$DEFAULT_ORG" '.["org-name"] // $default_org')

          echo "Processing dependency: $org_name/$repo"
          echo "Target branch: $TARGET_BRANCH"
          echo "Default branch: $DEFAULT_BRANCH"

          # Determine Branch
          selected_branch=""

          response=$(curl -s -H "Authorization: token $GH_DEP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$org_name/$repo/branches/$TARGET_BRANCH")

          if echo "$response" | jq -e '.name' >/dev/null 2>&1; then
            selected_branch="$TARGET_BRANCH"
            echo "Using target branch: $selected_branch"
          else
            selected_branch="$DEFAULT_BRANCH"
            echo "Target branch not found, using default: $selected_branch"
          fi

          echo "Cloning $org_name/$repo from branch $selected_branch"

          # Create temp directory if it doesn't exist
          mkdir -p temp

          # Checkout Repository (empty -c resets any extraheader persisted by actions/checkout)
          git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=$auth_header" \
            clone --depth 1 --branch "$selected_branch" \
            "https://github.com/$org_name/$repo.git" \
            "temp/$repo" || {
              echo "Error: Failed to clone $org_name/$repo"
              continue
            }

          echo "Successfully checked out $org_name/$repo on branch $selected_branch"
        done
