# .github/actions/load-dependencies/action.yml
name: 'Load Dependencies'
description: 'Loads and processes dependency configuration'

inputs:
  config-path:
    description: 'Path to dependencies configuration file'
    required: true
    default: '.github/config/mountainash_dependencies.yml'

outputs:
  dependencies:
    description: 'JSON string of processed dependencies'
    value: ${{ steps.parse-deps.outputs.deps }}

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: bash
      env:
        YQ_VERSION: v4.40.5
        # sha256 of yq_linux_amd64 for v4.40.5 (matches the upstream release `checksums` file)
        YQ_SHA256: 0d6aaf1cf44a8d18fbc7ed0ef14f735a8df8d2e314c4cc0f0242d35c0a440c95
      run: |
        set -euo pipefail
        # Install yq for YAML processing, verifying the pinned digest before use
        tmp="$(mktemp)"
        curl -fsSL -o "$tmp" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        echo "${YQ_SHA256}  ${tmp}" | sha256sum --check --strict -
        sudo install -m 0755 "$tmp" /usr/local/bin/yq
        rm -f "$tmp"

    - name: Parse Dependencies
      id: parse-deps
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        # Create a properly escaped JSON string
        DEPS=$(yq eval -o=json '.dependencies' "$CONFIG_PATH" | jq -c .)
        # Use a random delimiter so file content cannot terminate the multi-line value
        DELIM="deps_$(openssl rand -hex 16)"
        {
          echo "deps<<${DELIM}"
          echo "$DEPS"
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"

    - name: Debug Output
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        echo "Generated dependencies:"
        yq eval -o=json '.dependencies' "$CONFIG_PATH" | jq '.'
