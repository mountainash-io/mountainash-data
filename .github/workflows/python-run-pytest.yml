name: Pytest

on:
  pull_request:
    paths:
      - "src/mountainash_data/**"
      - "scripts/**"
      - "tests/**"
      - "hatch.toml"
      - "requirements-hatch.txt"
      - "pytest.ini"
      - "pyproject.toml"
      - ".github/actions/**"
      - ".github/config/mountainash_dependencies.yml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: "Fallback branch to use"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set fallback branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FALLBACK_BRANCH: ${{ github.event.inputs.fallback_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "FALLBACK_BRANCH=$DISPATCH_FALLBACK_BRANCH" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "FALLBACK_BRANCH=$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "FALLBACK_BRANCH=develop" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Display SQLite version
        run: |
          python -c "import sqlite3; print(f'SQLite version: {sqlite3.sqlite_version}')"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ github.head_ref }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Install Hatch
        run: pip install hatch==1.16.5

      - name: Run mypy
        run: hatch run mypy_github:check

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Verify optional backend modules are absent
        run: |
          hatch run test_github:python - <<'PY'
          import importlib.util

          names = ("psycopg", "MySQLdb", "oracledb", "trino", "google.oauth2")
          present = []
          for name in names:
              try:
                  if importlib.util.find_spec(name) is not None:
                      present.append(name)
              except ModuleNotFoundError:
                  pass
          assert not present, f"Unexpected optional backend modules: {present}"
          PY

      - name: Run Coverage Tests
        run: hatch run test_github:test-cov

      - name: Upload pytest JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1

  optional-backend:
    name: Optional backend (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: oracle
            module: oracledb
          - backend: trino
            module: trino
          - backend: bigquery
            module: google.oauth2

    steps:
      - name: Set fallback branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FALLBACK_BRANCH: ${{ github.event.inputs.fallback_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "FALLBACK_BRANCH=$DISPATCH_FALLBACK_BRANCH" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "FALLBACK_BRANCH=$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "FALLBACK_BRANCH=develop" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ github.head_ref }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Install Hatch
        run: "pip install hatch==1.16.5 --only-binary :all:"

      - name: Create optional-backend environment
        run: hatch env create test_optional.${{ matrix.backend }}

      - name: Verify optional dependency
        env:
          OPTIONAL_MODULE: ${{ matrix.module }}
        run: hatch run test_optional.${{ matrix.backend }}:python -c "import importlib; import os; importlib.import_module(os.environ['OPTIONAL_MODULE'])"

      - name: Run optional-backend contracts
        run: hatch run test_optional.${{ matrix.backend }}:test-cov

      - name: Upload pytest JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-optional-${{ matrix.backend }}
          path: junit-optional-${{ matrix.backend }}.xml
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage-optional-${{ matrix.backend }}.xml
          flags: optional-${{ matrix.backend }}
          verbose: true
