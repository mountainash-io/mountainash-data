# Pre-merge validation workflow
name: Validate Main Release PR - Build Dependencies

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  main-release-build-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    env:
      BUILD_ENV: "build_github"

    steps:
      # ======================================================
      # INITIALIZE

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # Get the target branch name (branch PR was merged into)
          persist-credentials: false

      - name: Set Branch Vars
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "SOURCE_BRANCH=$HEAD_REF" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$BASE_REF" >> "$GITHUB_ENV"

      # ======================================================
      # DEPENDENCIES

      - name: Python Dependencies
        run: |
          pip install hatchling==1.29.0
          pip install hatch==1.16.5

      # Checkout Mountain Ash Dependencies
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ env.TARGET_BRANCH }}
          default-branch: main
          token: ${{ steps.app-token.outputs.token }}
          org-name: ${{ env.ORGNAME }}

      # ======================================================
      # BUILD ARTIFACTS

      - name: Setup Build Environment
        run: |
          hatch env create "$BUILD_ENV"
