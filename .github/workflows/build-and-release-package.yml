name: Build and Release Wheel with SBOMs

on:
  pull_request:
    types: [closed]
    branches:
      - "main"
      - "develop"
      - "release*"
      - "feature*"
      - "bugfix*"
      - "hotfix*"

  # Add manual workflow dispatch with fallback branch selection
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to create"
        required: true
        default: "production"
        type: "choice"
        options:
          - production
          - rc
          - beta

      source_branch:
        description: "Branch containing code to release"
        required: true
        default: "main"
        type: "string"

      fallback_branch:
        description: "Fallback branch to use for dependencies"
        required: true
        default: "main"
        type: choice
        options:
          - develop
          - main

# Read-only by default; the single job below escalates to what it needs
# (tag push, release creation/asset upload).
permissions:
  contents: read

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    env:
      BUILD_ENV: "build_github"

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      # ======================================================
      # INITIALIZE

      - name: Setup Environment Variables
        run: |
          echo "PACKAGE_SRCDIR=mountainash_data" >> $GITHUB_ENV
          echo "PACKAGE_NAME=mountainash-data" >> $GITHUB_ENV
          echo "ORGNAME=mountainash-io" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout Repository (PR)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Checkout Repository (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 0

      - name: Set Branch Vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          DISPATCH_FALLBACK_BRANCH: ${{ github.event.inputs.fallback_branch }}
          DISPATCH_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # For manual runs, use the specified source branch
            echo "SOURCE_BRANCH=$DISPATCH_SOURCE_BRANCH" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$DISPATCH_SOURCE_BRANCH" >> "$GITHUB_ENV"
            echo "FALLBACK_BRANCH=$DISPATCH_FALLBACK_BRANCH" >> "$GITHUB_ENV"
            echo "MANUAL_RELEASE_TYPE=$DISPATCH_RELEASE_TYPE" >> "$GITHUB_ENV"
          else
            # Normal PR merge behavior
            echo "SOURCE_BRANCH=$HEAD_REF" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$BASE_REF" >> "$GITHUB_ENV"
            echo "FALLBACK_BRANCH=main" >> "$GITHUB_ENV"
            echo "MANUAL_RELEASE_TYPE=" >> "$GITHUB_ENV"
          fi

      # ======================================================
      # DEPENDENCIES

      - name: Python Dependencies
        run: |
          pip install hatchling==1.29.0
          pip install hatch==1.16.5

      # Checkout Mountain Ash Dependencies
      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ env.TARGET_BRANCH }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: ${{ env.ORGNAME }}

      # ======================================================
      # CONFIGURE RELEASE

      - name: Get Base Version
        id: base_version
        run: |
          # BASE_VERSION=$(python -c "import sys; sys.path.append('src'); from $PACKAGE_SRCDIR.__version__ import __version__; print(__version__)")
          BASE_VERSION=$(hatch version)
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV

          # Validate semantic version format
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Base version must be in semantic version format (X.Y.Z)"
            exit 1
          fi

      - name: Determine Release Configuration
        id: release_config
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Initialize variables
          RELEASE_TYPE=""
          VERSION_SUFFIX=""
          IS_PRERELEASE="true"
          RELEASE_TITLE=""
          RELEASE_DESCRIPTION=""

          # Function to get latest version number
          get_latest_version() {
            local prefix="$1"
            local suffix="$2"
            curl -s -H "Authorization: token $GH_API_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" | \
              jq -r --arg prefix "$prefix" --arg suffix "$suffix" \
              "map(select(.tag_name | startswith(\$prefix) and contains(\$suffix))) | .[0].tag_name" || echo ""
          }

          # Check for manual workflow run
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Using manual release type: $MANUAL_RELEASE_TYPE"

            case "$MANUAL_RELEASE_TYPE" in
              "production")
                RELEASE_TYPE="production"
                VERSION_SUFFIX=""
                IS_PRERELEASE="false"
                RELEASE_TITLE="Production Release"
                RELEASE_DESCRIPTION="Production release from ${SOURCE_BRANCH} branch"
                ;;
              "rc")
                RELEASE_TYPE="rc"
                # Get latest RC number for this version
                LATEST_RC=$(get_latest_version "v${BASE_VERSION}" "rc")
                RC_NUM=$(echo "$LATEST_RC" | grep -oP 'rc\K\d+' || echo "0")
                VERSION_SUFFIX="rc$((RC_NUM + 1))"
                RELEASE_TITLE="Release Candidate"
                RELEASE_DESCRIPTION="Release candidate from ${SOURCE_BRANCH} branch"
                ;;
              "beta")
                RELEASE_TYPE="beta"
                # Extract feature name from branch if possible
                FEATURE_NAME=$(printf '%s\n' "$SOURCE_BRANCH" | grep -oP '(feature|bugfix|hotfix)/\K[^/]+' || echo "manual")
                # Get latest beta number for this feature
                LATEST_BETA=$(get_latest_version "v${BASE_VERSION}" "beta.${FEATURE_NAME}")
                BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.[^.]+\.\K\d+' || echo "0")
                VERSION_SUFFIX="beta.${FEATURE_NAME}.$((BETA_NUM + 1))"
                RELEASE_TITLE="Beta Release"
                RELEASE_DESCRIPTION="Beta release from ${SOURCE_BRANCH} branch"
                ;;
            esac
          else

            # Determine release type and version suffix
            case "$TARGET_BRANCH" in
              "main")
                if [[ "$SOURCE_BRANCH" =~ ^(release|hotfix)/ ]]; then
                  RELEASE_TYPE="production"
                  VERSION_SUFFIX=""
                  IS_PRERELEASE="false"
                  RELEASE_TITLE="Production Release"
                  RELEASE_DESCRIPTION="Full production release from release branch"
                else
                  echo "Error: Only release branches can target main"
                  exit 1
                fi
                ;;

              "develop")
                RELEASE_TYPE="rc"
                # Get latest RC number for this version
                LATEST_RC=$(get_latest_version "v${BASE_VERSION}" "rc")
                RC_NUM=$(echo "$LATEST_RC" | grep -oP 'rc\K\d+' || echo "0")
                VERSION_SUFFIX="rc$((RC_NUM + 1))"
                RELEASE_TITLE="Release Candidate"
                RELEASE_DESCRIPTION="Release candidate for testing and validation"
                ;;

              *)
                if [[ "$SOURCE_BRANCH" == feature/* || "$SOURCE_BRANCH" == bugfix/* ]]; then
                  RELEASE_TYPE="beta"
                  # Extract feature/bugfix name from branch
                  FEATURE_NAME=$(printf '%s\n' "$SOURCE_BRANCH" | cut -d'/' -f2)
                  # Get latest beta number for this feature
                  LATEST_BETA=$(get_latest_version "v${BASE_VERSION}" "beta.${FEATURE_NAME}")
                  BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.[^.]+\.\K\d+' || echo "0")
                  VERSION_SUFFIX="beta.${FEATURE_NAME}.$((BETA_NUM + 1))"
                  RELEASE_TITLE="Beta Release"
                  RELEASE_DESCRIPTION="Beta release for feature testing: ${FEATURE_NAME}"
                fi
                ;;
            esac
          fi

          # Set full version
          FULL_VERSION="${BASE_VERSION}${VERSION_SUFFIX:+$VERSION_SUFFIX}"

          # Output all variables
          {
            echo "RELEASE_TYPE=${RELEASE_TYPE}"
            echo "VERSION_SUFFIX=${VERSION_SUFFIX}"
            echo "IS_PRERELEASE=${IS_PRERELEASE}"
            echo "FULL_VERSION=${FULL_VERSION}"
            echo "RELEASE_TITLE=${RELEASE_TITLE}"
            echo "RELEASE_DESCRIPTION=${RELEASE_DESCRIPTION}"
          } >> "$GITHUB_OUTPUT"

          echo "VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"

      - name: Validate Release
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi

          # Check if release already exists
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_API_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
            | jq -r '.id')
          if [ "$RELEASE_ID" != "null" ]; then
            echo "Error: Release v$VERSION already exists"
            exit 1
          fi

      - name: Create Release Branch
        if: startsWith(github.head_ref, 'release/') != true
        run: |
          RELEASE_BRANCH="release/${BASE_VERSION}"
          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH"; then
            git checkout -b "$RELEASE_BRANCH"
            git push -u origin "$RELEASE_BRANCH"
          fi

      # ======================================================
      # BUILD ARTIFACTS

      - name: Setup Build Environment
        run: |
          hatch env create "$BUILD_ENV"

      - name: Modify Version for Build with Hatch
        if: steps.release_config.outputs.VERSION_SUFFIX != ''
        run: |
          # Backup original version file
          cp "src/$PACKAGE_SRCDIR/__version__.py" "src/$PACKAGE_SRCDIR/__version__.py.bak"
          # Update version with suffix
          printf "__version__ = '%s'\n" "$VERSION" > "src/$PACKAGE_SRCDIR/__version__.py"

      - name: Verify Version Before Build
        run: |
          echo "Checking version from Hatch:"
          hatch version

      - name: Build Package
        id: build
        run: |
          hatch -e "$BUILD_ENV" build
          echo "WHEEL_FILE=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"
          echo "WHEEL_FILENAME=$(basename "$(ls dist/*.whl)")" >> "$GITHUB_OUTPUT"

      - name: Verify Apache-2.0 licence metadata and files in built artifacts
        env:
          DIST_DIR: dist
        run: |
          python -I - "$DIST_DIR" <<'PY'
          import sys, tarfile, zipfile
          from email.parser import BytesParser
          from pathlib import Path

          dist = Path(sys.argv[1])
          wheels, sdists = sorted(dist.glob('*.whl')), sorted(dist.glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1 or len(list(dist.iterdir())) != 2:
              raise SystemExit(f'{dist} must contain exactly one wheel and one sdist')
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              info, = {name.split('/')[0] for name in names if name.split('/')[0].endswith('.dist-info')}
              wheel = {n: archive.read(f'{info}/{p}') for n, p in (('METADATA', 'METADATA'), ('LICENSE', 'licenses/LICENSE'), ('NOTICE', 'licenses/NOTICE'))}
          with tarfile.open(sdists[0]) as archive:
              root, = {name.split('/')[0] for name in archive.getnames()}
              sdist = {n: archive.extractfile(f'{root}/{p}').read() for n, p in (('METADATA', 'PKG-INFO'), ('LICENSE', 'LICENSE'), ('NOTICE', 'NOTICE'))}
          for kind, files in (('wheel', wheel), ('sdist', sdist)):
              metadata = BytesParser().parsebytes(files['METADATA'])
              if metadata.get_all('License-Expression') != ['Apache-2.0']:
                  raise SystemExit(f'{kind} License-Expression is not exactly Apache-2.0')
              if not {'LICENSE', 'NOTICE'} <= set(metadata.get_all('License-File', [])):
                  raise SystemExit(f'{kind} License-File must include LICENSE and NOTICE')
              for name in ('LICENSE', 'NOTICE'):
                  if files[name] != Path(name).read_bytes():
                      raise SystemExit(f'{kind} {name} differs from the checked-out {name}')
          print('Apache-2.0 metadata, LICENSE, and NOTICE verified in wheel and sdist')
          PY

      - name: Restore Original Version
        if: steps.release_config.outputs.VERSION_SUFFIX != ''
        run: |
          mv "src/$PACKAGE_SRCDIR/__version__.py.bak" "src/$PACKAGE_SRCDIR/__version__.py"

      - name: Generate SBOMs
        run: |
          hatch run "$BUILD_ENV:sbom-all"
          hatch run "$BUILD_ENV:export-requirements"
          hatch run "$BUILD_ENV:sbom-direct"
          mv ./sbom-full.xml "./${PACKAGE_NAME}-${VERSION}-sbom-full.json"
          mv ./sbom-direct.xml "./${PACKAGE_NAME}-${VERSION}-sbom-direct.json"

      # ======================================================
      # PUBLISH

      - name: Create and Push Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: ${{ steps.release_config.outputs.RELEASE_TITLE }} v${{ env.VERSION }}
          draft: false
          prerelease: ${{ steps.release_config.outputs.IS_PRERELEASE }}
          body: |
            ${{ steps.release_config.outputs.RELEASE_DESCRIPTION }}

            ## Release Details
            - Type: ${{ steps.release_config.outputs.RELEASE_TYPE }}
            - Source Branch: ${{ github.head_ref }}
            - Target Branch: ${{ github.base_ref }}
            - Version: ${{ env.VERSION }}

            ## Package Information
            - Package: ${{ env.PACKAGE_NAME }}
            - Base Version: ${{ env.BASE_VERSION }}
            ${{ steps.release_config.outputs.VERSION_SUFFIX && format('- Version Suffix: {0}', steps.release_config.outputs.VERSION_SUFFIX) || '' }}

      - name: Upload Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.build.outputs.WHEEL_FILE }}
          asset_name: ${{ steps.build.outputs.WHEEL_FILENAME }}
          asset_content_type: application/octet-stream

      - name: Upload SBOM (Full)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-full.json
          asset_name: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-full.json
          asset_content_type: application/xml

      - name: Upload SBOM (Direct)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-direct.json
          asset_name: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-direct.json
          asset_content_type: application/xml

      - name: Setup Wheels Repository
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          WHEEL_FILE: ${{ steps.build.outputs.WHEEL_FILE }}
          WHEEL_FILENAME: ${{ steps.build.outputs.WHEEL_FILENAME }}
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Authenticate via an HTTP header rather than a token in the clone URL,
          # so the token is never stored in the wheels clone's remote URL/config.
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_B64"
          AUTH_HEADER="Authorization: basic $AUTH_B64"
          WHEELS_URL="https://github.com/$ORGNAME/mountainash-wheels.git"

          # Clone the wheels repository
          git -c "http.https://github.com/.extraheader=" -c "http.https://github.com/.extraheader=$AUTH_HEADER" clone "$WHEELS_URL" wheels-repo

          # Go to the wheels repository
          cd wheels-repo

          # Generate a unique branch name using a timestamp
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="release/${PACKAGE_NAME}-${VERSION}-${TIMESTAMP}"

          # Create a new branch for this release
          git checkout -b "$BRANCH_NAME"

          # Create package directory if it doesn't exist
          mkdir -p "$PACKAGE_NAME"

          # Copy the newly built wheel to the repository
          cp "../$WHEEL_FILE" "$PACKAGE_NAME/"

          # Add the new wheel file
          git add .

          # Commit the changes
          git commit -m "Add $WHEEL_FILENAME to wheels repository"

          # Push the branch to the repository
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push -u origin "$BRANCH_NAME"

          # Export the branch name for later steps
          echo "WHEELS_BRANCH=${BRANCH_NAME}" >> "$GITHUB_ENV"

      - name: Create Pull Request
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          WHEEL_FILENAME: ${{ steps.build.outputs.WHEEL_FILENAME }}
        run: |
          # Create a simpler PR body
          PR_BODY="This PR adds the following wheel file to the wheels repository:\n- ${WHEEL_FILENAME}\n\nThis was automatically generated from the release workflow of ${GITHUB_REPOSITORY}."

          # Build the JSON payload with jq so no value is spliced into JSON/shell text
          PAYLOAD=$(jq -n \
            --arg title "Add $PACKAGE_NAME v$VERSION to wheels repository" \
            --arg body "$PR_BODY" \
            --arg head "$WHEELS_BRANCH" \
            '{title: $title, body: $body, head: $head, base: "main"}')

          # Create the PR
          PR_RESPONSE=$(curl -X POST \
            -H "Authorization: token $GH_APP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$ORGNAME/mountainash-wheels/pulls" \
            -d "$PAYLOAD")

          echo "API Response: $PR_RESPONSE"

          # Extract PR URL and number
          PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url')
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')

          # Add labels to the PR
          if [ "$PR_NUMBER" != "null" ]; then
            curl -X POST \
              -H "Authorization: token $GH_APP_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$ORGNAME/mountainash-wheels/issues/$PR_NUMBER/labels" \
              -d '{
                "labels": ["automated", "wheel"]
              }'

            echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"
            echo "::notice::Pull Request created: ${PR_URL}"
          else
            echo "::error::Failed to create Pull Request"
            echo "$PR_RESPONSE"
            exit 1
          fi
