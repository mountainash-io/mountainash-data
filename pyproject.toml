[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dependencies = [
    "ibis-framework[polars,sqlite,duckdb]>=12.0.0",
    # "hatchling",


    # "ibis-framework[mssql,snowflake,bigquery,pyspark,trino] == 10.4.0",
    # "psycopg2-binary==2.9.9",
    # "pyodbc==5.2.0",
    # "snowflake-connector-python==3.12.3",

    "numpy>=1.23.2,<3",
    "rich>=12.4.4,<14",
    "universal_pathlib==0.2.2",
    "openlineage-python==1.17.1",
    "xarray==2024.11.0",
    "pyarrow>=17.0.0",
    "pyarrow-hotfix>=0.4,<1",
    "sqlalchemy",

    "duckdb>=0.10.3, <1.3.0",
    "pandas>=2.2.0",
    "polars>=1.16.0",
    "psutil>=7.0.0",
    "lazy_loader"

]
keywords = []
name = "mountainash_data"
dynamic = ["version"]
description = 'Mountain Ash - Data'
readme = "README.md"
requires-python = ">=3.10"
# license = "Proprietary"
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
all = [
    "psycopg-binary>=3.1.0",
    "pyodbc==5.2.0",
    "snowflake-connector-python==3.12.3",
    "setuptools",
    "ibis-framework[mssql,snowflake,postgres,pyspark,trino]>=12.0.0",
    # "ibis-framework[mssql,snowflake,postgres,bigquery,pyspark,trino]>=10.8.0",
]
mssql = ["pyodbc==5.2.0", "ibis-framework[mssql]>=12.0.0"]
snowflake = [
    "snowflake-connector-python==3.12.3",
    "ibis-framework[snowflake]>=12.0.0",
]
postgres = ["psycopg-binary>=3.1.0", "ibis-framework[postgres]>=12.0.0"]
bigquery = ["ibis-framework[bigquery]>=12.0.0"]
pyspark = ["setuptools", "ibis-framework[pyspark]>=12.0.0"]
clickhouse = ["ibis-framework[clickhouse]>=12.0.0"]
databricks = ["databricks-sql-connector>=4", "ibis-framework[databricks]>=12.0.0"]
singlestoredb = ["singlestoredb>=1.0", "ibis-framework[singlestoredb]>=12.0.0"]
exasol = ["pyexasol>=0.25.2", "ibis-framework[exasol]>=12.0.0"]
impala = ["impyla>=0.17", "ibis-framework[impala]>=12.0.0"]
materialize = ["psycopg>=3.2.0", "ibis-framework[materialize]>=12.0.0"]
risingwave = ["psycopg2>=2.8.4", "ibis-framework[risingwave]>=12.0.0"]
druid = ["pydruid>=0.6.7", "ibis-framework[druid]>=12.0.0"]
trino = ["ibis-framework[trino]>=12.0.0"]
oracle = ["ibis-framework[oracle]>=12.0.0"]


[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-data#readme"
Issues = "https://github.com/mountainash-io/mountainash-data/issues"
Source = "https://github.com/mountainash-io/mountainash-data"

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash_data", "tests"]
branch = true
parallel = true
omit = ["src/mountainash_data/__version__.py"]

[tool.coverage.paths]
mountainash_data = [
    "src/mountainash_data",
    "*/mountainash-data/src/mountainash_data",
]
tests = ["tests", "*/mountainash-data/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]

[tool.mypy]
# Internal mountainash siblings ship no py.typed marker, and optional drivers
# (trino/google/mountainash_dataframes) are not installed in the type
# env — treat all unresolved/untyped third-party imports as Any rather than noise.
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

