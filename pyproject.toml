[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dependencies = [
    "mountainash-settings>=0.1.0,<0.2",
    "mountainash-auth-client>=0.1.0,<0.2",
    "ibis-framework>=12.0.0",
    # Floor: CI's pinned version (requirements-hatch.txt); exp.Alter/AlterRename needed, absent in Ibis's 23.4 floor.
    # Cap: 30.18.0 drops the DROP-VIEW identifier for DuckDB memtable materialization; verified regression, no upstream fix yet.
    "sqlglot>=29.0.1,<30.18.0",
]
keywords = []
name = "mountainash_data"
dynamic = ["version"]
description = 'Mountain Ash - Data'
readme = "README.md"
requires-python = ">=3.12"
# license = "Proprietary"
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]


[project.optional-dependencies]
# One extra per dialect, named as the dialect key, delegating to Ibis's extra.
sqlite = ["ibis-framework[sqlite]>=12.0.0"]
duckdb = ["ibis-framework[duckdb]>=12.0.0"]
motherduck = ["ibis-framework[duckdb]>=12.0.0"]
polars = ["ibis-framework[polars]>=12.0.0"]
# psycopg[binary] bundles libpq; Ibis's plain psycopg needs a system libpq.
postgres = ["ibis-framework[postgres]>=12.0.0", "psycopg[binary]>=3.2.0"]
redshift = ["ibis-framework[postgres]>=12.0.0", "psycopg[binary]>=3.2.0"]
materialize = ["ibis-framework[materialize]>=12.0.0", "psycopg[binary]>=3.2.0"]
mysql = ["ibis-framework[mysql]>=12.0.0"]
mssql = ["ibis-framework[mssql]>=12.0.0"]
oracle = ["ibis-framework[oracle]>=12.0.0"]
snowflake = ["ibis-framework[snowflake]>=12.0.0"]
bigquery = ["ibis-framework[bigquery]>=12.0.0"]
trino = ["ibis-framework[trino]>=12.0.0"]
clickhouse = ["ibis-framework[clickhouse]>=12.0.0"]
databricks = ["ibis-framework[databricks]>=12.0.0"]
singlestoredb = ["ibis-framework[singlestoredb]>=12.0.0"]
exasol = ["ibis-framework[exasol]>=12.0.0"]
impala = ["ibis-framework[impala]>=12.0.0"]
risingwave = ["ibis-framework[risingwave]>=12.0.0"]
druid = ["ibis-framework[druid]>=12.0.0"]
pyspark = ["ibis-framework[pyspark]>=12.0.0"]
all = [
    "mountainash_data[sqlite,duckdb,motherduck,polars,postgres,redshift,materialize,mysql,mssql,oracle,snowflake,bigquery,trino,clickhouse,databricks,singlestoredb,exasol,impala,risingwave,druid,pyspark]",
]


[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-data#readme"
Issues = "https://github.com/mountainash-io/mountainash-data/issues"
Source = "https://github.com/mountainash-io/mountainash-data"

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash_data", "tests"]
branch = true
parallel = true
omit = ["src/mountainash_data/__version__.py"]

[tool.coverage.paths]
mountainash_data = [
    "src/mountainash_data",
    "*/mountainash-data/src/mountainash_data",
]
tests = ["tests", "*/mountainash-data/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]

[tool.mypy]
# Internal mountainash siblings ship no py.typed marker, and optional drivers
# (trino/google/mountainash_dataframes) are not installed in the type
# env — treat all unresolved/untyped third-party imports as Any rather than noise.
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
# Types pydantic models / pydantic-settings constructors (incl. `_env_file`-style init args).
plugins = ["pydantic.mypy"]
