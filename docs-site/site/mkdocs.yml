# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Mountainash Data'
site_description: 'An intelligent textbook for the mountainash-data unified database and lakehouse connectivity library'
site_author: 'Nathaniel Ramm'
site_url: !ENV [TEXTBOOK_SITE_URL, 'https://docs.mountainash.io/mountainash-data/']

# Hooks — runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/mountainash-io/mountainash-data'
edit_uri: !ENV [TEXTBOOK_EDIT_URI, 'edit/main/docs-site/site/docs/']

# Copyright
copyright: 'Copyright &copy; 2024-2026 Mountain Ash Solutions Pty. Ltd. Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. mountainash-data in the mountainash ecosystem: chapters/01-mountainash-data-in-the-ecosystem/index.md
      - 2. Installing and connecting: chapters/02-installing-and-connecting/index.md
      - 3. Connection profiles and authentication: chapters/03-connection-profiles-and-authentication/index.md
      - 4. Configuring connections with mountainash-settings: chapters/04-configuring-connections-with-mountainash-settings/index.md
      - 5. Inspecting databases: chapters/05-inspecting-databases/index.md
      - 6. Reading tables and running queries: chapters/06-reading-tables-and-running-queries/index.md
      - 7. Running mountainash expressions against databases: chapters/07-running-mountainash-expressions-against-databases/index.md
      - 8. Creating and changing tables: chapters/08-creating-and-changing-tables/index.md
      - 9. Indexes: chapters/09-indexes/index.md
      - 10. Transactions: chapters/10-transactions/index.md
      - 11. Adopting existing connections: chapters/11-adopting-existing-connections/index.md
      - 12. An end-to-end pipeline: chapters/12-an-end-to-end-pipeline/index.md
      - 13. Supported databases and limits: chapters/13-supported-databases-and-limits/index.md
      - 14. How one backend serves 20 dialects: chapters/14-how-one-backend-serves-20-dialects/index.md
      - 15. From settings to driver arguments: chapters/15-from-settings-to-driver-arguments/index.md
      - 16. Transaction and adoption internals: chapters/16-transaction-and-adoption-internals/index.md
      - 17. Extending mountainash-data: chapters/17-extending-mountainash-data/index.md
      - 18. Contributing and testing: chapters/18-contributing-and-testing/index.md

  - FAQ: faq.md
  - Glossary: glossary.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'teal'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mountainash Data'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
